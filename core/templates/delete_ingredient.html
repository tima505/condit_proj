{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center gap-4 border-b border-slate-200 pb-4">
        <a href="{% url 'manager_ingredients' %}" class="text-accent hover:text-accent/80 font-medium">← Назад</a>
        <h2 class="text-2xl font-bold tracking-tight text-red-600">Удалить сырье</h2>
    </div>

    <div class="bg-white border border-red-200 p-8 rounded-2xl shadow-sm text-center space-y-6">
        <div class="w-16 h-16 mx-auto bg-red-50 rounded-full flex items-center justify-center">
            <i data-lucide="trash-2" class="w-8 h-8 text-red-500"></i>
        </div>
        <div>
            <p class="text-lg text-slate-800 font-semibold">Вы уверены, что хотите удалить?</p>
            <p class="text-slate-500 mt-2">
                <span class="font-bold text-slate-700">{{ ingredient.name }}</span>
                ({{ ingredient.get_unit_display }})
            </p>
            <p class="text-red-500 text-sm mt-4 font-medium">Это действие нельзя отменить!</p>
        </div>

        <form method="post" class="flex justify-center gap-4 pt-4">
            {% csrf_token %}
            <a href="{% url 'manager_ingredients' %}"
                class="px-6 py-2.5 bg-transparent border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg transition-colors font-medium">Отмена</a>
            <button type="submit"
                class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow-lg transition-all hover:scale-105">
                Удалить
            </button>
        </form>
    </div>
</div>
{% endblock %}
