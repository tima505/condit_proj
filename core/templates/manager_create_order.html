{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center gap-4 border-b border-slate-200 pb-4">
        <a href="{% url 'manager_dashboard' %}" class="text-accent hover:text-accent/80 font-medium">← Назад</a>
        <h2 class="text-2xl font-bold tracking-tight">Создание заказа</h2>
    </div>

    <!-- Form -->
    <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="space-y-4">
                {{ form.as_p }}
                <!-- Note: CSS classes for form fields are set in forms.py widgets -->
            </div>

            <!-- Realtime Recipe Info -->
            <div class="mt-8 p-4 bg-slate-50 rounded-xl border border-slate-200 hidden" id="recipeInfoBlock">
                <h4 class="text-sm font-semibold text-slate-500 mb-3 border-b border-slate-200 pb-2">Планируемое списание
                    сырья (автоматически при старте):</h4>
                <ul id="recipeList" class="space-y-2 text-sm text-accent">
                    <!-- JS generated list -->
                </ul>
            </div>

            <div class="pt-6 border-t border-slate-200 flex justify-end gap-3">
                <a href="{% url 'manager_dashboard' %}"
                    class="px-5 py-2.5 bg-transparent border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg transition-colors font-medium">ОТМЕНА</a>
                <button type="submit"
                    class="px-5 py-2.5 bg-brandred hover:bg-red-700 text-white font-semibold rounded-lg shadow-lg flex items-center gap-2 transition-all hover:scale-105">
                    СОЗДАТЬ ЗАКАЗ
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Prepare JS Data -->
<script>
    const productRecipes = {
        {% for product in products %}
    "{{ product.id }}": [
        {% for item in product.recipe_items.all %}
    {
        ingredient: "{{ item.ingredient.name }}",
            quantity_per_unit: { { item.quantity_per_unit | stringformat: "f" } }
    },
    {% endfor %}
            ],
    {% endfor %}
    };

    const productDropdown = document.getElementById('id_product');
    const quantityInput = document.getElementById('id_quantity');
    const recipeInfoBlock = document.getElementById('recipeInfoBlock');
    const recipeList = document.getElementById('recipeList');

    function updateRecipeInfo() {
        const productId = productDropdown.value;
        const qty = parseFloat(quantityInput.value) || 0;

        if (productId && qty > 0 && productRecipes[productId] && productRecipes[productId].length > 0) {
            const items = productRecipes[productId];
            recipeList.innerHTML = '';

            items.forEach(item => {
                const total = (item.quantity_per_unit * qty).toFixed(2);
                const li = document.createElement('li');
                li.className = "flex justify-between";
                li.innerHTML = `<span>• ${item.ingredient}</span><span class="font-bold text-brandred">-${total}</span>`;
                recipeList.appendChild(li);
            });

            recipeInfoBlock.classList.remove('hidden');
        } else {
            recipeInfoBlock.classList.add('hidden');
        }
    }

    productDropdown.addEventListener('change', updateRecipeInfo);
    quantityInput.addEventListener('input', updateRecipeInfo);

    // Initial check
    updateRecipeInfo();
</script>
{% endblock %}
