{% extends 'base.html' %}
{% block content %}
<div class="space-y-8 animate-in fade-in duration-700">
    <div class="flex items-center justify-between border-b border-cardborder/40 pb-6">
        <div>
            <h2 class="text-3xl font-black tracking-tight text-textmain">Товары</h2>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Управление каталогом продукции
            </p>
        </div>
        <a href="{% url 'create_product' %}"
            class="px-5 py-2.5 bg-brandgreen hover:bg-brandgreen/90 text-white rounded-xl shadow-lg shadow-brandgreen/20 transition-all font-black uppercase text-xs flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            Новый Товар
        </a>
    </div>

    <div class="bg-cardbg/40 border border-cardborder/50 rounded-2xl shadow-2xl overflow-hidden mt-8">
        <div class="overflow-x-auto w-full">
            <table class="w-full text-left whitespace-nowrap min-w-max">
                <thead>
                    <tr
                        class="border-b border-cardborder/40 bg-sidebar/50 text-[10px] font-black uppercase tracking-widest text-slate-400">
                        <th class="px-8 py-5">ID</th>
                        <th class="px-8 py-5">Название</th>
                        <th class="px-8 py-5 text-right">Цена</th>
                        <th class="px-8 py-5 text-center">Действия</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-cardborder/30 text-sm">
                    {% for p in products %}
                    <tr class="hover:bg-accent/5 transition-colors group">
                        <td class="px-8 py-5 font-black text-accent text-xs uppercase tracking-widest">#{{ p.id }}
                        </td>
                        <td class="px-8 py-5 text-textmain font-bold">{{ p.name }}</td>
                        <td class="px-8 py-5 text-right text-brandgreen font-black">{{ p.price }} ₸</td>
                        <td class="px-8 py-5 text-center flex items-center justify-center gap-2">
                            <a href="{% url 'edit_product' p.id %}"
                                class="px-4 py-2 bg-accent/10 text-accent hover:bg-accent hover:text-white rounded-xl transition-all text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 border border-accent/20 hover:border-transparent">
                                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                                Изменить
                            </a>
                            <a href="{% url 'delete_product' p.id %}"
                                onclick="return confirm('Вы уверены, что хотите удалить товар &quot;{{ p.name }}&quot;? Это также удалит его рецепт.')"
                                class="px-4 py-2 bg-brandred/10 text-brandred hover:bg-brandred hover:text-white rounded-xl transition-all text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-2 border border-brandred/20 hover:border-transparent">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                Удалить
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="px-8 py-16 text-center text-slate-500 italic font-medium">
                            <div class="flex flex-col items-center gap-3">
                                <i data-lucide="cake-slice" class="w-10 h-10 opacity-20"></i>
                                <span>Товаров пока нет</span>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
