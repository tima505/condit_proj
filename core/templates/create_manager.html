{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center gap-4 border-b border-slate-200 pb-4">
        <a href="{% url 'manager_dashboard' %}" class="text-accent hover:text-accent/80 font-medium">← Назад</a>
        <h2 class="text-2xl font-bold tracking-tight">Создать Менеджера</h2>
    </div>

    <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="space-y-4">
                {{ form.as_p }}
            </div>

            <div class="pt-6 border-t border-slate-200 flex justify-end gap-3">
                <a href="{% url 'manager_dashboard' %}"
                    class="px-5 py-2.5 bg-transparent border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg transition-colors font-medium">ОТМЕНА</a>
                <button type="submit"
                    class="px-5 py-2.5 bg-accent hover:bg-accent/90 text-white font-semibold rounded-lg shadow-lg flex items-center gap-2 transition-all hover:scale-105">
                    СОЗДАТЬ
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
