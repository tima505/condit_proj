{% extends 'base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto space-y-6">
    <div class="flex items-center gap-4 border-b border-slate-200 pb-4">
        <a href="{% url 'manager_workers' %}" class="text-accent hover:text-accent/80 font-medium">← Назад</a>
        <h2 class="text-2xl font-bold tracking-tight text-blue-600">Создать новую роль</h2>
    </div>

    <div class="bg-white border border-slate-200 p-8 rounded-2xl shadow-sm">
        <form method="post" class="space-y-8">
            {% csrf_token %}
            
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-700 uppercase tracking-wider text-xs">Название роли</label>
                {{ form.name }}
            </div>

            <div class="space-y-4 pt-4">
                <label class="block text-sm font-semibold text-slate-700 uppercase tracking-wider text-xs border-b border-slate-100 pb-2">Настройка разрешений</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pt-2">
                    {% for field in form %}
                        {% if field.name != 'name' %}
                        <label class="flex items-center gap-3 p-4 border border-slate-200 rounded-xl hover:bg-slate-50 cursor-pointer transition-colors shadow-sm bg-white group hover:-translate-y-0.5 transform">
                            <input type="checkbox" name="{{ field.name }}" id="{{ field.id_for_label }}" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 shadow-sm">
                            <span class="text-sm font-medium text-slate-800 group-hover:text-blue-600 transition-colors">{{ field.label }}</span>
                        </label>
                        {% endif %}
                    {% endfor %}
                </div>
            </div>

            <div class="pt-8 border-t border-slate-200 flex justify-center">
                <button type="submit"
                    class="px-10 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition-all hover:scale-105 w-full sm:w-80">
                    Сохранить роль
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
