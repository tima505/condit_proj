{% extends 'base.html' %}
{% block content %}
<div class="space-y-6 max-w-7xl mx-auto">
    <div class="flex items-center justify-between border-b border-slate-200 pb-4">
        <h2 class="text-3xl font-bold tracking-tight">Список Оптовиков</h2>
        <a href="{% url 'create_wholesaler' %}"
            class="px-4 py-2 border border-accent text-accent rounded-lg hover:bg-accent/5 transition-colors font-bold">
            + Новый Оптовик
        </a>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden mt-8">
        <div class="overflow-x-auto w-full">
            <table class="w-full text-left whitespace-nowrap min-w-max">
                <thead>
                    <tr class="border-b border-slate-200 bg-slate-50 text-xs uppercase tracking-wider text-slate-500">
                        <th class="px-6 py-4 font-semibold">Имя / Компания</th>
                        <th class="px-6 py-4 font-semibold">Телефон</th>
                        <th class="px-6 py-4 font-semibold text-right">Текущий Долг</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm">
                    {% for w in wholesalers %}
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 font-medium text-slate-900">
                            <a href="{% url 'wholesaler_detail' w.pk %}" class="text-blue-600 hover:text-blue-800 hover:underline transition-colors">
                                {{ w.name }}
                            </a>
                        </td>
                        <td class="px-6 py-4">{{ w.phone|default:"---" }}</td>
                        <td
                            class="px-6 py-4 text-right {% if w.balance > 0 %}text-brandred font-bold animate-pulse{% else %}text-brandgreen{% endif %}">
                            {{ w.balance }} ₸
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="px-6 py-8 text-center text-slate-400 italic">Оптовиков пока нет</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
