{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b border-slate-200 pb-4">
        <h2 class="text-3xl font-bold tracking-tight">Добавить Сырье</h2>
        <a href="{% url 'manager_ingredients' %}"
            class="px-4 py-2 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors text-slate-600">
            Назад
        </a>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 md:p-8">
        <form method="post" class="space-y-6">
            {% csrf_token %}

            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium opacity-80 mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                <p class="mt-1 text-sm text-brandred font-medium">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <div class="pt-4 border-t border-slate-200">
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-accent hover:bg-accent/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent transition-colors">
                    Добавить
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
