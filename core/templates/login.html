<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Конфети 🎂</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        accent: '#10b981',
                        brandred: '#dc2626',
                        brandblue: '#3b82f6',
                    }
                }
            }
        }
    </script>
</head>

<body class="flex items-center justify-center min-h-screen bg-slate-50 text-slate-900 font-sans">

    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold mb-2 text-slate-900">Конфети 🎂</h1>
            <p class="text-sm text-slate-400">Войдите в систему для управления производством</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-sm font-medium text-slate-600 mb-1">Имя пользователя
                    (Логин)</label>
                <input type="text" name="username" id="id_username" required autofocus
                    class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:ring-2 focus:ring-accent transition-all">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-medium text-slate-600 mb-1">Пароль</label>
                <input type="password" name="password" id="id_password" required
                    class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 text-slate-900 focus:outline-none focus:ring-2 focus:ring-accent transition-all">
            </div>

            {% if form.errors %}
            <div class="p-3 text-sm text-brandred bg-red-50 border border-red-100 rounded-lg">
                Имя пользователя или пароль введены неверно. Пожалуйста, попробуйте снова.
            </div>
            {% endif %}

            <button type="submit"
                class="w-full py-3 px-4 bg-accent hover:bg-accent/90 text-white font-semibold rounded-lg shadow-md transition-all duration-200 mt-4">
                Войти в систему
            </button>
        </form>
    </div>

</body>

</html>
